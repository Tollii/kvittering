name: TestFlight OTA update

on:
  workflow_dispatch:
    inputs:
      message:
        description: Description of the reviewed compatible update
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: testflight
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
      SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: npm
      - uses: expo/expo-github-action@eab7a230208c952974db8c3245cfd78402c7b385 # v9
        with:
          eas-version: 24.7.0
          token: ${{ secrets.EXPO_TOKEN }}
      - run: npm ci
      - name: Check application and compatibility tests
        run: npm run check
      - name: Check staging release readiness
        env:
          CONVEX_DEPLOY_KEY: ${{ secrets.CONVEX_STAGING_DEPLOY_KEY }}
        run: npm run release:check

      - name: Publish compatible iOS update
        env:
          UPDATE_MESSAGE: ${{ inputs.message }}
        run: eas update --channel testflight --environment preview --platform ios --message "$UPDATE_MESSAGE" --non-interactive
      - name: Upload update source maps to Sentry
        run: npm run sentry:sourcemaps
