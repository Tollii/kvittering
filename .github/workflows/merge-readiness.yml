name: Merge readiness

# Only main is executed. Pull-request content and comments are API data, never code.
on:
  push:
    branches: [main]
  status:
  issue_comment:
    types: [created, edited]
  schedule:
    - cron: "*/15 * * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: merge-readiness
  cancel-in-progress: false

jobs:
  verify:
    if: >-
      github.event_name != 'issue_comment' ||
      (github.event.issue.pull_request && github.event.comment.user.login == 'coderabbitai[bot]')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      actions: read
      pull-requests: read
      checks: write
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          ref: main
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: 24
      - name: Check current pull requests
        env:
          GH_TOKEN: ${{ github.token }}
        run: node tools/merge-readiness.mts --publish
