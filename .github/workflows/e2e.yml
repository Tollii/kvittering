name: End-to-end

# Maestro flows on the iOS Simulator against a local Convex backend. The
# simulator app is cached by native fingerprint, so a JavaScript-only change
# reuses the build and only re-embeds its bundle.
#
# While the repository is private, macOS minutes are billed, so the job runs
# automatically only for changes to the flows themselves or with the `e2e`
# label. Once public, it also runs for native changes and nightly on main.
# Agents and people can start it for any branch with workflow_dispatch.
on:
  pull_request:
    types: [opened, synchronize, reopened, labeled]
  schedule:
    - cron: "0 3 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: e2e-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  scope:
    name: Decide whether to run
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      run: ${{ steps.decide.outputs.run }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: 24
      - name: List change areas
        id: areas
        if: github.event_name == 'pull_request'
        env:
          BASE: ${{ github.event.pull_request.base.sha }}
        run: node tools/presubmit.mts "$BASE"
      - name: Decide
        id: decide
        env:
          EVENT: ${{ github.event_name }}
          PRIVATE: ${{ github.event.repository.private }}
          LABELLED: ${{ contains(github.event.pull_request.labels.*.name, 'e2e') }}
          NATIVE: ${{ steps.areas.outputs.native }}
          FLOWS: ${{ steps.areas.outputs.e2e }}
        run: |
          run=false
          case "$EVENT" in
            workflow_dispatch) run=true ;;
            schedule) [[ "$PRIVATE" == "false" ]] && run=true ;;
            pull_request)
              if [[ "$LABELLED" == "true" || "$FLOWS" == "true" ]]; then run=true; fi
              if [[ "$PRIVATE" == "false" && "$NATIVE" == "true" ]]; then run=true; fi
              ;;
          esac
          echo "run=$run" >> "$GITHUB_OUTPUT"
          echo "End-to-end run: $run ($EVENT)" >> "$GITHUB_STEP_SUMMARY"

  ios:
    name: iOS Simulator flows
    needs: scope
    if: needs.scope.outputs.run == 'true'
    runs-on: macos-26
    timeout-minutes: 75
    env:
      MAESTRO_VERSION: 2.10.0
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: 24
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Fingerprint the native runtime
        id: fingerprint
        run: echo "hash=$(npx expo-updates fingerprint:generate --platform ios | jq -r .hash)" >> "$GITHUB_OUTPUT"
      - name: Restore the simulator build
        id: app
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: build/cache/kvitto.app
          key: e2e-ios-app-${{ steps.fingerprint.outputs.hash }}
      - name: Install Maestro
        run: |
          curl -fsSL "https://get.maestro.mobile.dev" | bash
          echo "$HOME/.maestro/bin" >> "$GITHUB_PATH"
      - name: Run flows
        env:
          E2E_APP_CACHE: ${{ steps.app.outputs.cache-hit == 'true' && 'build/cache/kvitto.app' || '' }}
        run: tools/e2e/ios.sh
      # A finished build is reusable even when a flow fails.
      - name: Save the simulator build
        id: built
        if: always() && steps.app.outputs.cache-hit != 'true' && hashFiles('build/kvitto.app/Info.plist') != ''
        run: |
          mkdir -p build/cache
          cp -R build/kvitto.app build/cache/kvitto.app
      - uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        if: always() && steps.built.outcome == 'success'
        with:
          path: build/cache/kvitto.app
          key: e2e-ios-app-${{ steps.fingerprint.outputs.hash }}
      - name: Upload screenshots and logs
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: e2e-ios
          path: build/e2e/
          if-no-files-found: ignore
          retention-days: 14
