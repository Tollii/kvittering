name: TestFlight

on:
  workflow_dispatch:
    inputs:
      operation:
        description: Release operation
        type: choice
        required: true
        default: build-and-submit
        options:
          - build-and-submit
          - submit-existing
      build_id:
        description: Expo build ID (required for submit-existing)
        type: string
        required: false

permissions:
  contents: read

concurrency:
  group: testflight
  cancel-in-progress: false

jobs:
  release:
    name: Release to TestFlight
    runs-on: ubuntu-latest
    timeout-minutes: 120
    env:
      EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
      SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }}
    steps:
      - name: Check release inputs
        env:
          OPERATION: ${{ inputs.operation }}
          BUILD_ID: ${{ inputs.build_id }}
        run: |
          if [[ -z "$EXPO_TOKEN" ]]; then
            echo "::error::Add an Expo access token as the EXPO_TOKEN repository secret."
            exit 1
          fi
          if [[ "$OPERATION" == "submit-existing" ]]; then
            if [[ ! "$BUILD_ID" =~ ^[0-9a-fA-F]{8}(-[0-9a-fA-F]{4}){3}-[0-9a-fA-F]{12}$ ]]; then
              echo "::error::Enter the Expo build ID to submit."
              exit 1
            fi
          elif [[ -n "$BUILD_ID" ]]; then
            echo "::error::Leave build_id empty when creating a new build."
            exit 1
          fi

      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: npm

      - name: Set up Expo
        uses: expo/expo-github-action@eab7a230208c952974db8c3245cfd78402c7b385 # v9
        with:
          eas-version: 24.7.0
          token: ${{ secrets.EXPO_TOKEN }}

      - name: Install dependencies
        run: npm ci

      - name: Check application
        if: inputs.operation == 'build-and-submit'
        run: npm run check

      - name: Deploy staging backend
        if: inputs.operation == 'build-and-submit'
        env:
          CONVEX_DEPLOY_KEY: ${{ secrets.CONVEX_STAGING_DEPLOY_KEY }}
        run: |
          if [[ "$CONVEX_DEPLOY_KEY" != 'prod:courteous-jay-215|'* ]]; then
            echo "::error::Set CONVEX_STAGING_DEPLOY_KEY to a deploy key for staging (courteous-jay-215)."
            exit 1
          fi
          npx convex deploy

      - name: Build iOS app
        id: build
        if: inputs.operation == 'build-and-submit'
        run: |
          eas build --platform ios --profile testflight --non-interactive --wait --json > "$RUNNER_TEMP/testflight-build.json"
          build_id=$(jq -er '.[0] | select(.status == "FINISHED") | .id' "$RUNNER_TEMP/testflight-build.json")
          echo "build_id=$build_id" >> "$GITHUB_OUTPUT"

      - name: Check selected build
        env:
          BUILD_ID: ${{ steps.build.outputs.build_id || inputs.build_id }}
        run: |
          eas build:view "$BUILD_ID" --json > "$RUNNER_TEMP/testflight-build-details.json"
          project_id=$(jq -r '.expo.extra.eas.projectId' app.json)
          bundle_id=$(jq -r '.expo.ios.bundleIdentifier' app.json)
          jq -e --arg project_id "$project_id" --arg bundle_id "$bundle_id" '
            .status == "FINISHED" and
            .platform == "IOS" and
            .distribution == "STORE" and
            .buildProfile == "testflight" and
            .app.id == $project_id and
            .appIdentifier == $bundle_id
          ' "$RUNNER_TEMP/testflight-build-details.json" > /dev/null
          build_url="https://expo.dev/accounts/atolness-team/projects/kvitto/builds/$BUILD_ID"
          echo "Build: [$BUILD_ID]($build_url)" >> "$GITHUB_STEP_SUMMARY"

      - name: Submit to TestFlight
        env:
          BUILD_ID: ${{ steps.build.outputs.build_id || inputs.build_id }}
        run: |
          eas submit --platform ios --profile testflight --id "$BUILD_ID" --non-interactive --wait
          echo "Upload complete. [Check Apple processing and tester access](https://appstoreconnect.apple.com/apps/6813602733/testflight)." >> "$GITHUB_STEP_SUMMARY"
