# The parent directory selects tools/e2e/fixtures/reviewed-receipts/.
appId: no.tolnes.kvitto
name: Open a reviewed receipt from history
---
- runFlow: ../shared/sign-in.yml
- tapOn: "Historikk"
- extendedWaitUntil:
    visible: "REMA 1000.*"
    timeout: 30000
- tapOn: "REMA 1000.*"
- assertVisible: "REMA 1000"
- assertVisible: ".*63,80.*"
- assertVisible: "Kategorier"
- assertVisible: "Brød og bakst,.*39,90.*"
