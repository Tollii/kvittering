# The parent directory selects tools/e2e/fixtures/needs-review/.
appId: no.tolnes.kvitto
name: Approve a complete receipt from the inbox with a swipe
---
- runFlow: ../shared/sign-in.yml
- tapOn: "Innboks"
- extendedWaitUntil:
    visible: "Til kontroll"
    timeout: 30000
- assertVisible: "MENY.*"
- assertVisible: "KIWI.*Betalt beløp mangler.*"
- assertVisible: "REMA 1000.*Mulig duplikat.*"
- assertVisible: "Lesingen mislyktes.*"
# Only the receipt without open questions can be approved from the list.
- swipe:
    from:
      text: "MENY.*"
    direction: LEFT
- extendedWaitUntil:
    notVisible: "MENY.*"
    timeout: 30000
- assertVisible: "KIWI.*"
- tapOn: "Historikk"
- extendedWaitUntil:
    visible: "MENY.*"
    timeout: 30000
- tapOn: "MENY.*"
- assertVisible: "Kontrollert"
- assertVisible: ".*157,80.*"
